# Gantry — choose the database in .env (see .env.example):
#
#   SQLite (default):  docker compose up -d
#   MySQL:             DB_DRIVER=mysql COMPOSE_PROFILES=mysql docker compose up -d
#                      (or put both variables in .env)

services:
  gantry:
    build: .
    image: gantry:latest
    container_name: gantry
    restart: unless-stopped
    ports:
      - "${GANTRY_PORT:-3000}:3000"
    environment:
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      # SQLite
      SQLITE_PATH: /data/gantry.db
      # MySQL (used when DB_DRIVER=mysql)
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gantry}
      MYSQL_USER: ${MYSQL_USER:-gantry}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gantry}
      # Session signing secret; generated into /data/secret.key when empty.
      GANTRY_SECRET: ${GANTRY_SECRET:-}
      # "auto" marks the cookie Secure when served over HTTPS (via a reverse proxy).
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      # Only behind a reverse proxy you control that sets X-Forwarded-For.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # First run: /setup needs the token printed in `docker logs gantry`.
      GANTRY_SETUP_TOKEN: ${GANTRY_SETUP_TOKEN:-}
      # Or create the first admin at startup instead of using /setup.
      GANTRY_ADMIN_USERNAME: ${GANTRY_ADMIN_USERNAME:-}
      GANTRY_ADMIN_PASSWORD: ${GANTRY_ADMIN_PASSWORD:-}
      # Dashboard history: sampling interval (seconds) and retention (days).
      METRICS_INTERVAL_SECONDS: ${METRICS_INTERVAL_SECONDS:-60}
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS:-7}
      # Image update checks against the registries (hours; 0 = on demand only).
      UPDATE_CHECK_INTERVAL_HOURS: ${UPDATE_CHECK_INTERVAL_HOURS:-6}
      # Public URL (OIDC callback: $GANTRY_URL/auth/oidc/callback).
      GANTRY_URL: ${GANTRY_URL:-}
      # Single sign-on (OpenID Connect); off unless issuer and client id are set.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      OIDC_AUTO_CREATE: ${OIDC_AUTO_CREATE:-false}
      OIDC_ADMIN_GROUPS: ${OIDC_ADMIN_GROUPS:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-}
      OIDC_USERNAME_CLAIM: ${OIDC_USERNAME_CLAIM:-}
      # "admins": with SSO on, only administrators may sign in with a password (break-glass).
      PASSWORD_LOGIN: ${PASSWORD_LOGIN:-all}
    # Group that owns /var/run/docker.sock on the host: stat -c '%g' /var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gantry-data:/data
    depends_on:
      mysql:
        condition: service_healthy
        required: false

  mysql:
    image: mysql:8.4
    container_name: gantry-mysql
    profiles: ["mysql"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gantry}
      MYSQL_USER: ${MYSQL_USER:-gantry}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gantry}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-gantry-root}
    volumes:
      - gantry-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  gantry-data:
  gantry-mysql:
