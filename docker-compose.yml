# Gantry. Works without any configuration:
#
#   docker compose up -d --build
#
# Settings go in .env, all optional (.env.example has the common ones,
# docs/configuration.md every variable). MySQL instead of SQLite: add
#   COMPOSE_FILE=docker-compose.yml:docker-compose.mysql.yml
# to .env.

services:
  gantry:
    build: .
    # GANTRY_IMAGE=ghcr.io/teknik-github/gantry:latest uses the published
    # image (docker compose pull) instead of building it here.
    image: ${GANTRY_IMAGE:-gantry:latest}
    container_name: gantry
    restart: unless-stopped
    # Every variable in .env reaches Gantry as it is.
    env_file:
      - path: .env
        required: false
    # Fixed by the image and the mounts below, whatever .env says.
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATA_DIR: /data
      SQLITE_PATH: /data/gantry.db
      DOCKER_SOCKET: /var/run/docker.sock
    ports:
      - "${GANTRY_PORT:-3000}:3000"
    volumes:
      # The entrypoint gives Gantry the socket's group; no group id to look up.
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - gantry-data:/data

volumes:
  gantry-data:
